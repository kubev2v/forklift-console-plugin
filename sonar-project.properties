#
# Source analysis — exclude tests/mocks (classified as test code below) and i18n locale JSON.
# Locale files contain UI labels such as "passphrase" that trigger json:S2068 false positives
# whenever Memsource downloads touch them; they are validated by npm run test:i18n instead.
#
sonar.sources = ./
sonar.exclusions = ./**/__tests__/**/*, ./**/*.test.tsx, ./**/__mocks__/**/*, ./**/*.mock.ts, locales/**

#
# Test and mock code
#
sonar.tests = ./
sonar.test.inclusions = ./**/__tests__/**/*, ./**/*.test.tsx, ./**/__mocks__/**/*, ./**/*.mock.ts
