# SonarCloud automatic analysis configuration (not sonar-project.properties).
# See https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# Locale JSON contains UI labels such as "passphrase" that trigger json:S2068 false
# positives on every Memsource download PR. Excluded from analysis; validated by
# npm run test:i18n instead.
sonar.exclusions=locales/**
