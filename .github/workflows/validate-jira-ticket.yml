name: Validate Jira Ticket

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: validate-jira-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate-jira:
    name: Validate Jira Ticket
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/jira-refresh') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure jq is available
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Resolve pull request context
        id: pr_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_number="$PR_NUMBER"
            pr_title="$PR_TITLE"
            pr_body="$PR_BODY"
          else
            pr_number="$ISSUE_NUMBER"
            pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
            pr_title=$(echo "$pr_json" | jq -r '.title')
            pr_body=$(echo "$pr_json" | jq -r '.body // ""')
          fi

          {
            echo "pr_number=$pr_number"
            echo "pr_title<<EOF"
            echo "$pr_title"
            echo "EOF"
            echo "pr_body<<EOF"
            echo "$pr_body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch PR commits
        id: fetch_commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr_context.outputs.pr_number }}
        run: |
          set -euo pipefail

          curl -sSf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            > /tmp/pr-commits.json

          echo "commits_json=/tmp/pr-commits.json" >> "$GITHUB_OUTPUT"

      - name: Validate Jira ticket
        id: validate
        continue-on-error: true
        env:
          COMMITS_JSON: ${{ steps.fetch_commits.outputs.commits_json }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          PR_BODY: ${{ steps.pr_context.outputs.pr_body }}
          PR_TITLE: ${{ steps.pr_context.outputs.pr_title }}
        run: |
          set -euo pipefail

          chmod +x ./scripts/validate-jira-ticket.sh
          ./scripts/validate-jira-ticket.sh \
            --pr-title "$PR_TITLE" \
            --pr-body "$PR_BODY" \
            --commits-json "$COMMITS_JSON" \
            --output-file "$GITHUB_OUTPUT" \
            --verbose

      - name: Post validation comment
        if: steps.validate.outputs.status == 'passed' || steps.validate.outputs.status == 'failed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          FIX_VERSIONS: ${{ steps.validate.outputs.fix_versions }}
          MISSING_FIELDS: ${{ steps.validate.outputs.missing }}
          PR_NUMBER: ${{ steps.pr_context.outputs.pr_number }}
          SPRINT_NAMES: ${{ steps.validate.outputs.sprint_names }}
          STATUS: ${{ steps.validate.outputs.status }}
          STORY_POINTS: ${{ steps.validate.outputs.story_points }}
          TICKET_KEY: ${{ steps.validate.outputs.ticket_key }}
        with:
          script: |
            const marker = '<!-- jira-validate -->';
            const ticketKey = process.env.TICKET_KEY;
            const passed = process.env.STATUS === 'passed';
            const fixVersions = process.env.FIX_VERSIONS || '—';
            const sprintNames = process.env.SPRINT_NAMES || '—';
            const storyPoints = process.env.STORY_POINTS || '—';
            const missingFields = process.env.MISSING_FIELDS || '';
            const ticketUrl = `https://redhat.atlassian.net/browse/${ticketKey}`;

            const statusIcon = (value) => (value && value !== '—' ? '✅' : '❌');

            let body = `${marker}
            ## Jira ticket check: [${ticketKey}](${ticketUrl})

            | Field | Status |
            | --- | --- |
            | Fix version | ${statusIcon(fixVersions)} ${fixVersions} |
            | Sprint | ${statusIcon(sprintNames)} ${sprintNames} |
            | Story points | ${statusIcon(storyPoints)} ${storyPoints} |
            `;

            if (passed) {
              body += '\nAll required Jira fields are set.';
            } else {
              body += `\nMissing required fields: ${missingFields}.`;
              body += '\n\nComment `/jira-refresh` after updating the ticket to re-run this check.';
            }

            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

      - name: Fail when validation failed
        if: steps.validate.outputs.status == 'failed'
        run: |
          echo "::error::Jira ticket ${TICKET_KEY} is missing required fields: ${MISSING_FIELDS}"
          exit 1
        env:
          MISSING_FIELDS: ${{ steps.validate.outputs.missing }}
          TICKET_KEY: ${{ steps.validate.outputs.ticket_key }}
