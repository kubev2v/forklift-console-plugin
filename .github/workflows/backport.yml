name: Backport
on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: backport-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  backport:
    name: Backport
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: |
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, '/backport') ||
        startsWith(github.event.comment.body, '/cherrypick') ||
        startsWith(github.event.comment.body, '/cherry-pick')
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure jq is available
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Parse comment and validate inputs
        id: parse_comment
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Accept /backport, /cherrypick, /cherry-pick
          comment_body="$COMMENT_BODY"
          pr_number="${{ github.event.issue.number }}"

          echo "📝 Parsing comment: $comment_body"

          # Split into words
          read -ra words <<< "$comment_body"

          # Extract the command word and branch
          cmd="${words[0]}"
          branch_name="${words[1]:-}"

          # Flags (e.g., --dry-run) may appear after the branch
          dry_run="false"
          for word in "${words[@]:2}"; do
            if [[ "$word" == "--dry-run" ]]; then
              dry_run="true"
              break
            fi
          done

          # Validate presence of branch
          if [[ -z "$branch_name" ]]; then
            echo "::error::Missing branch name in command"
            echo "::error::Usage: ${cmd} release-X.Y[.Z] [--dry-run]"
            exit 1
          fi

          # Validate branch format: release-X.Y or release-X.Y.Z
          if [[ ! "$branch_name" =~ ^release-[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid branch name format: $branch_name"
            echo "::error::Branch name must follow pattern: release-X.Y or release-X.Y.Z (e.g., release-2.9 or release-2.9.3)"
            exit 1
          fi

          # Outputs
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          echo "dry_run=$dry_run" >> $GITHUB_OUTPUT

          echo "✅ Parsed:"
          echo "  - Command: $cmd"
          echo "  - Target branch: $branch_name"
          echo "  - PR number: $pr_number"
          echo "  - Dry run: $dry_run"

      - name: Verify PR and target branch exist
        id: verify_refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.parse_comment.outputs.pr_number }}
          BRANCH_NAME: ${{ steps.parse_comment.outputs.branch_name }}
        run: |
          set -euo pipefail

          echo "🔍 Verifying PR #$PR_NUMBER..."
          repo="${{ github.repository }}"
          api="${{ github.api_url }}/repos/${repo}/pulls/${PR_NUMBER}"
          pr_data=$(curl -sSf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" 2>/dev/null || echo "null")

          if [[ "$pr_data" == "null" ]]; then
            echo "::error::PR #$PR_NUMBER not found"
            exit 1
          fi

          pr_merged=$(echo "$pr_data" | jq -r '.merged')
          pr_title=$(echo "$pr_data" | jq -r '.title')
          pr_head_ref=$(echo "$pr_data" | jq -r '.head.ref')

          echo "  - PR Merged: $pr_merged"
          echo "  - PR Title: $pr_title"
          echo "  - Head ref: $pr_head_ref"

          if [[ "$pr_merged" != "true" ]]; then
            echo "::error::PR #$PR_NUMBER is not merged (merged=$pr_merged). Aborting."
            exit 1
          fi

          echo "🔍 Verifying target branch '$BRANCH_NAME' on origin..."
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "  ✅ Target branch exists"
          else
            echo "::error::Target branch '$BRANCH_NAME' does not exist on remote 'origin'"
            exit 1
          fi

          echo "pr_title=$pr_title" >> $GITHUB_OUTPUT
          echo "pr_merged=$pr_merged" >> $GITHUB_OUTPUT

      - name: Extract Jira ticket from original PR
        id: extract_ticket
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.parse_comment.outputs.pr_number }}
          PR_TITLE: ${{ steps.verify_refs.outputs.pr_title }}
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          ticket_key=""
          skip_reason=""

          echo "🔍 Extracting Jira ticket from PR #$PR_NUMBER..."

          # Fetch commits from the PR
          commits_data=$(curl -sSf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${repo}/pulls/${PR_NUMBER}/commits?per_page=100")

          # Search commit messages for "Resolves:" line
          resolves_line=""
          while IFS= read -r msg; do
            if [[ -n "$msg" ]]; then
              resolves_line="$msg"
              break
            fi
          done < <(echo "$commits_data" | jq -r '.[].commit.message' | grep -i "^Resolves:" | head -1)

          if [[ -n "$resolves_line" ]]; then
            # Check for "Resolves: None" (case-insensitive)
            if echo "$resolves_line" | grep -iq "^Resolves:[[:space:]]*none$"; then
              echo "ℹ️ Original PR has 'Resolves: None' - no ticket attached"
              skip_reason="no_ticket_attached"
            else
              # Extract MTV-XXXX pattern (take the first one)
              ticket_key=$(echo "$resolves_line" | grep -oE "MTV-[0-9]+" | head -1 || true)
              if [[ -z "$ticket_key" ]]; then
                echo "⚠️ Found Resolves line but no MTV ticket: $resolves_line"
                skip_reason="ticket_not_found"
              else
                echo "✅ Found ticket: $ticket_key"
              fi
            fi
          else
            # Fallback: check PR title for MTV-XXXX
            pr_title="$PR_TITLE"
            ticket_key=$(echo "$pr_title" | grep -oE "MTV-[0-9]+" | head -1 || true)
            if [[ -n "$ticket_key" ]]; then
              echo "✅ Found ticket in PR title: $ticket_key"
            else
              echo "⚠️ Cannot find an MTV ticket in commits or PR title"
              skip_reason="ticket_not_found"
            fi
          fi

          echo "ticket_key=$ticket_key" >> $GITHUB_OUTPUT
          echo "skip_reason=$skip_reason" >> $GITHUB_OUTPUT

      - name: Post ticket skip comment
        if: steps.extract_ticket.outputs.skip_reason != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const skipReason = '${{ steps.extract_ticket.outputs.skip_reason }}';

            let body;
            if (skipReason === 'no_ticket_attached') {
              body = `ℹ️ **Jira Target Version Skipped**\n\nBackport parent has no ticket attached to it (\`Resolves: None\`). Skipping Target Version update.`;
            } else {
              body = `⚠️ **Jira Target Version Skipped**\n\nCannot find an MTV ticket in the original PR. Skipping Target Version update.\nPlease set the Target Version on the original ticket manually if a z-stream clone is needed.`;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Set Target Version on original ticket
        id: set_target_version
        if: steps.extract_ticket.outputs.ticket_key != '' && steps.parse_comment.outputs.dry_run == 'false'
        continue-on-error: true
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_KEY: ${{ steps.extract_ticket.outputs.ticket_key }}
          BRANCH_NAME: ${{ steps.parse_comment.outputs.branch_name }}
        run: |
          set -euo pipefail

          JIRA_BASE="https://redhat.atlassian.net"
          AUTH_HEADER="Authorization: Basic $(echo -n "${JIRA_EMAIL}:${JIRA_API_TOKEN}" | base64 -w 0)"

          jira_get() {
            curl -sSf -H "$AUTH_HEADER" -H "Content-Type: application/json" "$1"
          }

          jira_put() {
            curl -sSf -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/json" -d "$2" "$1"
          }

          echo "target_version_set=false" >> $GITHUB_OUTPUT
          echo "target_version_name=" >> $GITHUB_OUTPUT

          # Read RVERSION from build/release.conf on target branch (next z-stream)
          rversion=""
          if release_conf=$(git show "origin/${BRANCH_NAME}:build/release.conf" 2>/dev/null); then
            rversion=$(echo "$release_conf" | awk -F= '$1 == "RVERSION" {print $2; exit}')
            echo "  - RVERSION from release.conf: $rversion"
          else
            echo "::warning::Could not read build/release.conf from branch $BRANCH_NAME"
            exit 0
          fi

          if [[ -z "$rversion" ]]; then
            echo "::warning::RVERSION not found in release.conf on $BRANCH_NAME"
            exit 0
          fi

          # Reject unexpected values before exporting to later github-script steps
          if [[ ! "$rversion" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Invalid RVERSION format (expected X.Y.Z): $rversion"
            exit 0
          fi

          echo "target_version_name=$rversion" >> $GITHUB_OUTPUT

          # Resolve version ID from MTV project versions
          version_id=""
          if versions_data=$(jira_get "${JIRA_BASE}/rest/api/3/project/MTV/versions"); then
            version_id=$(echo "$versions_data" | jq -r --arg name "$rversion" '
              [.[] | select(.name == $name)]
              | first
              | .id // empty
            ' || true)
          else
            echo "::warning::Could not fetch MTV versions; skipping Target Version update"
            exit 0
          fi

          if [[ -z "$version_id" ]]; then
            echo "::warning::No Jira version named '$rversion' found in MTV project"
            exit 0
          fi

          echo "  - Matched version ID: $version_id ($rversion)"

          # Fetch current Target Version (customfield_10855) on the original ticket
          original_data=$(jira_get "${JIRA_BASE}/rest/api/3/issue/${TICKET_KEY}?fields=customfield_10855")
          existing_target_versions=$(echo "$original_data" | jq -c '[.fields.customfield_10855[]? | {id: .id}]')

          already_set=$(echo "$original_data" | jq -r --arg name "$rversion" '
            [.fields.customfield_10855[]? | select(.name == $name)]
            | length
          ')

          if [[ "$already_set" != "0" ]]; then
            echo "✅ Target Version '$rversion' already set on $TICKET_KEY (idempotent skip)"
            echo "target_version_set=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Append the new version without replacing existing Target Versions
          update_payload=$(jq -n \
            --argjson existing "$existing_target_versions" \
            --arg new_id "$version_id" \
            '{fields: {customfield_10855: ($existing + [{id: $new_id}])}}')

          echo "📝 Setting Target Version '$rversion' on $TICKET_KEY..."
          if jira_put "${JIRA_BASE}/rest/api/3/issue/${TICKET_KEY}" "$update_payload"; then
            echo "✅ Set Target Version '$rversion' on $TICKET_KEY (Jira automation will create the z-stream clone)"
            echo "target_version_set=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Failed to set Target Version on $TICKET_KEY"
          fi

      - name: Post status comment (start)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BRANCH_NAME: ${{ steps.parse_comment.outputs.branch_name }}
          DRY_RUN: ${{ steps.parse_comment.outputs.dry_run }}
          PR_NUMBER: ${{ steps.parse_comment.outputs.pr_number }}
          TARGET_VERSION_NAME: ${{ steps.set_target_version.outputs.target_version_name }}
          TARGET_VERSION_SET: ${{ steps.set_target_version.outputs.target_version_set }}
          TICKET_KEY: ${{ steps.extract_ticket.outputs.ticket_key }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const branch = process.env.BRANCH_NAME;
            const dryRun = process.env.DRY_RUN === 'true';
            const ticketKey = process.env.TICKET_KEY;
            const targetVersionSet = process.env.TARGET_VERSION_SET === 'true';
            const targetVersionName = process.env.TARGET_VERSION_NAME;
            const prNumber = process.env.PR_NUMBER;

            let jiraInfo = '';
            if (targetVersionSet && ticketKey && targetVersionName) {
              jiraInfo = `\n🎫 Set Target Version \`${targetVersionName}\` on [${ticketKey}](https://redhat.atlassian.net/browse/${ticketKey}); Jira automation will create the z-stream clone`;
            }

            const body = `🔄 **Backport Status**

            Starting backport of PR #${prNumber} to \`${branch}\`
            ${dryRun ? '🧪 **Dry run mode** - No actual changes will be made' : '🚀 **Live mode** - Changes will be applied'}${jiraInfo}

            [View workflow run](${process.env.WORKFLOW_RUN_URL})`;

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Perform backport
        id: backport
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: kiegroup/git-backporting@7ff4fce545cf2b9170c91c032bf66a9348ba2490
        with:
          target-branch: ${{ steps.parse_comment.outputs.branch_name }}
          pull-request: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.parse_comment.outputs.pr_number }}
          no-squash: true
          auth: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ steps.parse_comment.outputs.dry_run }}
          title: "[${{ steps.parse_comment.outputs.branch_name }}] ${{ steps.verify_refs.outputs.pr_title }}"
          body: |
            Backport of #${{ steps.parse_comment.outputs.pr_number }} to `${{ steps.parse_comment.outputs.branch_name }}`

            Original PR: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.parse_comment.outputs.pr_number }}
            ${{ steps.extract_ticket.outputs.ticket_key && format('Original Jira: https://redhat.atlassian.net/browse/{0}', steps.extract_ticket.outputs.ticket_key) || '' }}

      - name: Post success comment
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BRANCH_NAME: ${{ steps.parse_comment.outputs.branch_name }}
          DRY_RUN: ${{ steps.parse_comment.outputs.dry_run }}
          PR_NUMBER: ${{ steps.parse_comment.outputs.pr_number }}
          TARGET_VERSION_NAME: ${{ steps.set_target_version.outputs.target_version_name }}
          TARGET_VERSION_SET: ${{ steps.set_target_version.outputs.target_version_set }}
          TICKET_KEY: ${{ steps.extract_ticket.outputs.ticket_key }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const branch = process.env.BRANCH_NAME;
            const dryRun = process.env.DRY_RUN === 'true';
            const ticketKey = process.env.TICKET_KEY;
            const targetVersionSet = process.env.TARGET_VERSION_SET === 'true';
            const targetVersionName = process.env.TARGET_VERSION_NAME;
            const prNumber = process.env.PR_NUMBER;

            let body;
            if (dryRun) {
              body = `✅ **Backport Dry Run Completed**

              The backport of PR #${prNumber} to \`${branch}\` was successful in dry-run mode.

              To perform the actual backport, run:
              \`/backport ${branch}\` (without --dry-run flag)`;
            } else {
              let jiraInfo = '';
              if (targetVersionSet && ticketKey && targetVersionName) {
                jiraInfo = `\n🎫 Target Version \`${targetVersionName}\` set on [${ticketKey}](https://redhat.atlassian.net/browse/${ticketKey})`;
              }
              body = `✅ **Backport Completed Successfully**

              PR #${prNumber} has been successfully backported to \`${branch}\`.

              A new pull request should have been created with the backported changes.${jiraInfo}`;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Label new backport PR (skip on dry run)
        id: label_pr
        if: success() && steps.parse_comment.outputs.dry_run == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = '${{ steps.parse_comment.outputs.branch_name }}';
            const originalNumber = parseInt('${{ steps.parse_comment.outputs.pr_number }}', 10);

            // Heuristic: find the most recent open PR to the target branch
            // that looks like a backport of the original PR.
            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: branch, per_page: 100
            });

            // 2-hour window to avoid mislabeling old PRs
            const TWO_HOURS = 2 * 60 * 60 * 1000;
            const now = new Date().getTime();

            const candidates = openPRs.filter(pr => {
              const created = new Date(pr.created_at).getTime();
              const fresh = (now - created) < TWO_HOURS;
              const body = pr.body || '';
              // Require the backport PR body to reference the original PR number/URL
              // so concurrent backports to the same branch are not mislabeled.
              const mentionsOriginal =
                body.includes(`#${originalNumber}`) ||
                body.includes(`/pull/${originalNumber}`);

              return fresh && mentionsOriginal;
            });

            if (!candidates.length) {
              core.info('No candidate backport PR found to label (yet).');
              core.setOutput('backport_pr_url', '');
              return;
            }

            // Pick the newest candidate
            const pr = candidates.sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];

            const label = `backport-${branch}`;
            // Ensure label exists (create if missing)
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'ededed',
                description: `Backport PRs targeting ${branch}`
              });
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.number, labels: [label]
            });

            core.info(`Applied label '${label}' to PR #${pr.number}`);
            core.setOutput('backport_pr_url', pr.html_url);

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BRANCH_NAME: ${{ steps.parse_comment.outputs.branch_name || 'unknown' }}
          PR_NUMBER: ${{ steps.parse_comment.outputs.pr_number || github.event.issue.number }}
          PR_TITLE: ${{ steps.verify_refs.outputs.pr_title || 'Original PR title' }}
          TICKET_KEY: ${{ steps.extract_ticket.outputs.ticket_key }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const branch = process.env.BRANCH_NAME;
            const prNumber = process.env.PR_NUMBER;
            const ticketKey = process.env.TICKET_KEY;
            const serverUrl = context.serverUrl;
            const repository = `${owner}/${repo}`;

            // Fetch commit SHAs from the original PR for pastable commands
            let commitShas = '';
            try {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: parseInt(prNumber, 10), per_page: 100
              });
              commitShas = commits.map(c => c.sha.substring(0, 12)).join(' ');
            } catch {
              commitShas = '<commit-sha(s)>';
            }

            // Single-quote for safe copy-paste into a shell (escape embedded quotes)
            const shellQuote = (value) => `'${String(value).replace(/'/g, `'\\''`)}'`;
            const prTitle = process.env.PR_TITLE;
            const originalPrUrl = `${serverUrl}/${repository}/pull/${prNumber}`;
            const jiraLine = ticketKey
              ? `\nOriginal Jira: https://redhat.atlassian.net/browse/${ticketKey}`
              : '';
            const quotedTitle = shellQuote(`[${branch}] ${prTitle}`);
            const quotedBody = shellQuote(
              `Backport of #${prNumber} to \`${branch}\`\n\nOriginal PR: ${originalPrUrl}${jiraLine}`
            );

            const body = `❌ **Backport Failed**

            The backport of PR #${prNumber} to \`${branch}\` failed.

            Common causes:
            - Merge conflicts that require manual resolution
            - Target branch doesn't exist
            - Invalid branch name format (must be release-X.Y or release-X.Y.Z)

            Please check the [workflow logs](${process.env.WORKFLOW_RUN_URL}) for details.

            ---

            **Manual resolution steps:**

            \`\`\`bash
            git fetch origin
            git checkout -b backport-${prNumber}-to-${branch} origin/${branch}
            git cherry-pick -x ${commitShas}
            # Resolve any conflicts, then:
            git add .
            git cherry-pick --continue
            git push origin backport-${prNumber}-to-${branch}
            gh pr create --base ${branch} --title ${quotedTitle} --body ${quotedBody}
            \`\`\``;

            await github.rest.issues.createComment({ owner, repo, issue_number, body });
